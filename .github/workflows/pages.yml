# Adapted from:
# https://github.com/actions/starter-workflows/blob/main/pages/static.yml

name: Pages

on:
  # re-enable for troubleshooting.
  # push:
  #   branches:
  #     - pagesCI
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download web editor release and project build
        env:
          GH_TOKEN: ${{ github.token }}
          GODOT_REPO: FilamentGames/godot
        run: |
          set -euo pipefail
          mkdir -p site dl

          # Newest fila-* release (incl. prereleases) that has a web-editor asset
          tag=$(gh api "repos/$GODOT_REPO/releases?per_page=30" --jq \
            '[.[] | select(.tag_name | startswith("fila-"))
                  | select(any(.assets[]; .name | startswith("web-editor-")))][0].tag_name // empty')
          [ -n "$tag" ] || { echo "No fila-* web-editor release found" >&2; exit 1; }
          echo "Using $GODOT_REPO release $tag"
          gh release download "$tag" --repo "$GODOT_REPO" --pattern 'web-editor-*.zip' --output dl/WEB_EDITOR.zip

          unzip -o dl/WEB_EDITOR.zip -d dl/web
          mv dl/web/* site/
          mkdir -p site/projects

          # fetch_chapter <artifact name> <chapter name>
          # Newest unexpired artifact from build.yml, re-zipped into site/projects/<chapter>.zip
          fetch_chapter() {
            local artname="$1" chapter="$2" art
            art=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artname&per_page=10" --jq \
              '[.artifacts[] | select(.expired | not)][0].id // empty')
            [ -n "$art" ] || { echo "No unexpired $artname artifact found" >&2; exit 1; }
            echo "Using artifact $art for chapter $chapter"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$art/zip" > "dl/$chapter.zip"

            # Re-zip so the archive has explicit directory entries; the web editor's zip installer needs them.
            mkdir "dl/$chapter"
            unzip -q "dl/$chapter.zip" -d "dl/$chapter"
            (cd "dl/$chapter" && zip -qr "../../site/projects/$chapter.zip" .)
            test -f "site/projects/$chapter.zip" || { echo "$chapter.zip missing" >&2; exit 1; }
          }

          fetch_chapter project.zip project
          fetch_chapter debug-project.zip debug-project

          test -f site/godot.editor.html || { echo "godot.editor.html missing" >&2; exit 1; }
          cp site/godot.editor.html site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
