# Adapted from:
# https://github.com/actions/starter-workflows/blob/main/pages/static.yml

name: Pages

on:
  # re-enable for troubleshooting.
  # push:
  #   branches:
  #     - pagesCI
  workflow_dispatch:
  # workflow_run always executes the default branch's copy of this file, so
  # builds of staging/production can deploy despite environment branch rules.
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build site (web editor + chapter zips)
        env:
          GH_TOKEN: ${{ github.token }}
          GODOT_REPO: FilamentGames/godot
        run: ./.github/workflows/scripts/build_site.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
