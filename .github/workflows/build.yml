name: Build

on:
  push:
    # Each listed branch is built (and deployed as a chapter) when pushed.
    # To add a chapter, add the branch here and merge this file into that branch.
    branches:
      - main
      - staging
      - production
      - pages/multiProjects
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Compute chapter name
        # Artifact/folder names can't contain '/'
        run: echo "CHAPTER=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Remove and disable GUT tests
        run: ./.github/workflows/scripts/disable_gut.sh
      
      - name: Enable autorun in editor
        run: ./.github/workflows/scripts/enable_autorun.sh
      
      - name: Generate level backups
        run: ./.github/workflows/scripts/create_level_backups.sh

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false

      - name: Generate dot-Godot folder
        run: godot --headless --path . --import --quit

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-project-${{ env.CHAPTER }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          # This is set in GitHub by going:
          #   Settings -> Secrets and Varaibles -> Actions -> Variables
          path: ${{ vars.ARTIFACT_PATHS }}

      - name: Disable Baby Godot Dev Tools
        run: ./.github/workflows/scripts/disable_dev_tools.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-${{ env.CHAPTER }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          # This is set in GitHub by going:
          #   Settings -> Secrets and Varaibles -> Actions -> Variables
          path: ${{ vars.ARTIFACT_PATHS }}

  # Pages deployment is started by pages.yml via workflow_run (always runs from
  # the default branch, which the github-pages environment requires).
