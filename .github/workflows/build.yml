name: Build

on:
  push:
    branches:
      - main
      - ci/dotGodotGen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
    
      - name: Remove and disable GUT tests
        run: ./.github/workflows/scripts/disable_gut.sh
      
      - name: Enable autorun in editor
        run: ./.github/workflows/scripts/enable_autorun.sh
      
      - name: Generate level backups
        run: ./.github/workflows/scripts/create_level_backups.sh

      - name: Generate dot-Godot folder via precompiled editor.
        env:
          GH_TOKEN: ${{ github.token }}
          GODOT_REPO: FilamentGames/godot
        run: |
          set -euo pipefail
          mkdir -p dl

          # Newest fila-* release (incl. prereleases) that has a web-editor asset
          tag=$(gh api "repos/$GODOT_REPO/releases?per_page=30" --jq \
            '[.[] | select(.tag_name | startswith("fila-"))
                  | select(any(.assets[]; .name | startswith("web-editor-")))][0].tag_name // empty')
          [ -n "$tag" ] || { echo "No fila-* web-editor release found" >&2; exit 1; }
          echo "Using $GODOT_REPO release $tag"
          gh release download "$tag" --repo "$GODOT_REPO" --pattern 'linux-editor-*.zip' --output dl/linux_editor.zip

          # godot.linuxbsd.editor.x86_64.mono
          unzip -o dl/linux_editor.zip -d dl/linux
          editor=$(find "$dl/linux" -name 'godot.linuxbsd.editor.*' -type f | head -1)
          chmod +x "$editor"
          "$editor" --headless --path . --import --quit

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-project.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          # This is set in GitHub by going:
          #   Settings -> Secrets and Varaibles -> Actions -> Variables
          path: ${{ vars.ARTIFACT_PATHS }}

      - name: Disable Baby Godot Dev Tools
        run: ./.github/workflows/scripts/disable_dev_tools.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: project.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          # This is set in GitHub by going:
          #   Settings -> Secrets and Varaibles -> Actions -> Variables
          path: ${{ vars.ARTIFACT_PATHS }}

  deploy-pages:
    name: Deploy Artifacts to Pages
    needs: build
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml