name: Build

on:
  push:
    branches:
      - main
      - ci/dotGodotGen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
    
      - name: Remove and disable GUT tests
        run: ./.github/workflows/scripts/disable_gut.sh
      
      - name: Enable autorun in editor
        run: ./.github/workflows/scripts/enable_autorun.sh
      
      - name: Generate level backups
        run: ./.github/workflows/scripts/create_level_backups.sh

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false

      - name: Generate dot-Godot folder
        run: godot --headless --path . --import --quit

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-project.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          # This is set in GitHub by going:
          #   Settings -> Secrets and Varaibles -> Actions -> Variables
          path: ${{ vars.ARTIFACT_PATHS }}

      - name: Disable Baby Godot Dev Tools
        run: ./.github/workflows/scripts/disable_dev_tools.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: project.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          # This is set in GitHub by going:
          #   Settings -> Secrets and Varaibles -> Actions -> Variables
          path: ${{ vars.ARTIFACT_PATHS }}

  deploy-pages:
    name: Deploy Artifacts to Pages
    needs: build
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml