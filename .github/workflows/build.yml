name: Build

on:
  push:
    branches:
      - main
      - ci/dotGodotGen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # # There's no official image available for Godot, but this community
    # #  container has a lot of tools that will be helpful in the long run
    # container: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v7
    
      - name: Remove and disable GUT tests
        run: ./.github/workflows/scripts/disable_gut.sh
      
      - name: Enable autorun in editor
        run: ./.github/workflows/scripts/enable_autorun.sh
      
      - name: Generate level backups
        run: ./.github/workflows/scripts/create_level_backups.sh

      # - name: Generate dot-Godot folder
      #   # the container puts godot on the path
      #   run: godot --headless --path . --import --quit

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-project.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          # This is set in GitHub by going:
          #   Settings -> Secrets and Varaibles -> Actions -> Variables
          path: ${{ vars.ARTIFACT_PATHS }}

      - name: Disable Baby Godot Dev Tools
        run: ./.github/workflows/scripts/disable_dev_tools.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: project.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          # This is set in GitHub by going:
          #   Settings -> Secrets and Varaibles -> Actions -> Variables
          path: ${{ vars.ARTIFACT_PATHS }}

  deploy-pages:
    name: Deploy Artifacts to Pages
    needs: build
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml